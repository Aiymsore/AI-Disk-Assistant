name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      # 失败时把测试输出逐行转成 ::error:: 注解：注解可经公开 API 读取，无需仓库管理员权限。
      # 按文件隔离运行：单个文件内的解释器崩溃（segfault 级）不会吞掉其余文件的定位信息。
      - name: Tests with coverage
        shell: bash
        run: |
          set -o pipefail
          status=0
          rm -f tests-output.txt
          failed_file=""
          for f in tests/test_*.py; do
            echo "=== $f ===" | tee -a tests-output.txt
            if ! python -m coverage run -m unittest "$f" -v 2>&1 | tee -a tests-output.txt; then
              status=1
              if [ -z "$failed_file" ]; then failed_file="$f"; fi
              echo "::error title=crashed-or-failed::$f"
            fi
          done
          if [ -n "$failed_file" ] && [ -f tests-output.txt ]; then
            n=0
            tail -n 35 tests-output.txt | while IFS= read -r line; do
              n=$((n+1))
              echo "::error title=ci-$n::$line"
            done
          fi
          exit "$status"
      - name: Coverage report
        if: always()
        run: python -m coverage report --fail-under=75 || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-output-${{ matrix.os }}-${{ matrix.python-version }}
          path: tests-output.txt
          if-no-files-found: warn
      - name: Build package
        run: python -m build
