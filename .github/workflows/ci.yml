name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      # 失败时把 FAIL/ERROR 行转成 ::error:: 注解：注解可经公开 API 读取，无需仓库管理员权限。
      - name: Tests with coverage
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run -m unittest discover -s tests -v 2>&1 | tee tests-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^(FAIL|ERROR):" tests-output.txt | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 80 tests-output.txt
            exit "$code"
          fi
      - name: Coverage report
        if: always()
        run: python -m coverage report --fail-under=75 || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-output-${{ matrix.os }}-${{ matrix.python-version }}
          path: tests-output.txt
          if-no-files-found: warn
      - name: Build package
        run: python -m build
