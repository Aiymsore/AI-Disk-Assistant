name: Windows Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^(FAIL|ERROR):" tests-output.txt | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 80 tests-output.txt
            exit "$code"
          fi
      - name: Generate application icon
        run: python tools/make_icon.py
      - name: Build CLI executable
        run: pyinstaller --clean --noconfirm --onefile --name P4Disk4P --icon assets/app.ico main.py
      - name: Build GUI executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name P4Disk4P-GUI --icon assets/app.ico gui.py
      - name: Prepare release package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $folder = "release/P4Disk4P-$version-Windows"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item dist/P4Disk4P.exe $folder/
          Copy-Item dist/P4Disk4P-GUI.exe $folder/
          Copy-Item .env.example $folder/
          Copy-Item README.md $folder/
          Copy-Item LICENSE $folder/
          Copy-Item SECURITY.md $folder/
          Copy-Item docs/SETUP_GUIDE.md $folder/
          Compress-Archive -Path "$folder/*" -DestinationPath "release/P4Disk4P-$version-Windows.zip"
          Get-FileHash dist/P4Disk4P.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256SUMS.txt
          Get-FileHash dist/P4Disk4P-GUI.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256SUMS.txt -Append
      - uses: actions/upload-artifact@v4
        with:
          name: P4Disk4P-Windows
          path: |
            dist/P4Disk4P.exe
            dist/P4Disk4P-GUI.exe
            release/*.zip
            release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/P4Disk4P.exe
            dist/P4Disk4P-GUI.exe
            release/*.zip
            release/SHA256SUMS.txt
