[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "P4Disk4P"
# 与 ai_disk_assistant/__init__.py 的 __version__ 保持一致
version = "1.3.0"
description = "A safety-first Windows disk analysis assistant: rules + AI advice, reports only, no deletion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "傅继锋" }]
dependencies = []

[project.scripts]
p4disk4p = "ai_disk_assistant.cli:main"
p4disk4p-gui = "ai_disk_assistant.gui:main"

[tool.setuptools.packages.find]
include = ["ai_disk_assistant*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["demo/sample_disk", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F"]
