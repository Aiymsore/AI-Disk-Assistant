[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-disk-assistant"
version = "1.2.1"
description = "A safety-first Windows disk analysis assistant supporting Responses and Chat Completions APIs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "傅继锋" }]
dependencies = ["Send2Trash>=1.8"]

[project.scripts]
ai-disk-assistant = "ai_disk_assistant.cli:main"
ai-disk-assistant-gui = "ai_disk_assistant.gui:main"

[tool.setuptools.packages.find]
include = ["ai_disk_assistant*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["demo/sample_disk", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F"]
